  <title>Sito di prova di Go Ital IA</title>
  <style>
    :root { color-scheme: light dark; --testo: #1d1d1f; --fondo: #fafafa; --tenue: #6e6e73; }

           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 34rem; padding: 2rem 1rem; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
    p { margin: 0; color: var(--tenue); }

</head>
